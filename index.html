    let conn = null, opened = false, done = false;
    const fail = err => { if (done) return; done = true; clearTimeout(timer); handlers.onError(err); };
    const timer = setTimeout(() => { if (!opened) fail({ type: 'timeout', message: 'Could not connect to that room (timed out).' }); }, CONNECT_TIMEOUT);
    peer.on('open', () => {
      conn = peer.connect(PREFIX + code, { reliable: true, serialization: 'json' });
      conn.on('open', () => { opened = true; clearTimeout(timer); handlers.onOpen(conn); });
      conn.on('data', msg => handlers.onData(msg));
      conn.on('close', () => { if (opened && !done) { done = true; handlers.onClose(); } });
      conn.on('error', () => { if (opened && !done) { done = true; handlers.onClose(); } });
    });
    peer.on('error', err => {
      if (opened && err.type !== 'peer-unavailable') { if (!done) { done = true; handlers.onClose(); } return; }
      fail(err);
    });
    return { destroy() { done = true; clearTimeout(timer); peer.destroy(); } };
  }

  return { available, host, join, cleanCode, describe };
})();
</script>

<!-- ======================================================================
     APP: menu, host and client sessions, lobby, game screen.
     ====================================================================== -->
<script id="app-js">
'use strict';
(() => {
  const $app = document.getElementById('app');
  const $banner = document.getElementById('banner');
  const MAPS = {};
  document.querySelectorAll('script[id^="map-"]').forEach(el => { const m = JSON.parse(el.textContent); MAPS[m.id] = m; });
  let MAP = MAPS.uk;
  for (const m of Object.values(MAPS)) Sim.setMap(m);   // register them all
  Sim.setMap(MAP);

  const area = n => { try { return window[n]; } catch (e) { return null; } };
  const store = {
    get(k, a = area('localStorage')) { try { return a ? a.getItem(k) : null; } catch (e) { return null; } },
    set(k, v, a = area('localStorage')) { try { if (a) a.setItem(k, v); } catch (e) { /* private mode */ } },
  };
  const SS = () => area('sessionStorage');
  // Per tab, so a refresh rejoins as the same player.
  const newPlayerId = () => { const id = 'p' + Math.random().toString(36).slice(2, 10); store.set('ukc.pid', id, SS()); return id; };
  const playerId = () => store.get('ukc.pid', SS()) || newPlayerId();
  const INSTANCE = Math.random().toString(36).slice(2, 10);
  const cleanName = n => String(n || '').replace(/[^\p{L}\p{N} _'.-]/gu, '').trim().slice(0, 12);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  // The host decides colours (team tints in 2 v 2); fall back to the player's own colour.
  const colourOf = o => {
    if (o < 0) return CONFIG.neutralColour;
    const p = snap && snap.players.find(q => q.idx === o);
    return (p && p.colour) || CONFIG.players[o].colour;
  };
  const SHAPE_CHAR = { circle: '●', triangle: '▲', square: '■', diamond: '◆' };
  const shapeOf = o => SHAPE_CHAR[CONFIG.players[o].shape];
  const reduced = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const buzz = ms => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* unsupported */ } };

  let session = null;      // { act(type, data), destroy(), code, isHost, me }
  let snap = null;         // latest snapshot from the host
  let clockOffset = null;  // local ms minus sim ms, for smooth fleet movement
  let menuMsg = '';
  const banner = t => { $banner.textContent = t || ''; };

  function onSnapshot(s) {
    // The host picked another map: switch to it and rebuild the board.
    const want = s.phase === 'lobby' ? s.mapId : s.map;
    if (want && MAPS[want] && MAP !== MAPS[want]) { MAP = MAPS[want]; Sim.setMap(MAP); Game.teardown(); }
    const local = performance.now();
    const sample = local - s.t;
    if (clockOffset === null || sample < clockOffset || (snap && s.t < snap.t)) clockOffset = sample;
    else clockOffset += (sample - clockOffset) * 0.05;
    const prev = snap;
    snap = s;
    show(s, prev);
  }
  const simNow = () => (snap ? Math.min(performance.now() - clockOffset, snap.t + 1000) : 0);

  // =========================================================================
  // HOST: runs the Sim on a fixed tick and broadcasts snapshots
  // =========================================================================
  function createHost(name, resume) {
    const game = resume ? resume.game : Sim.createGame();
    const meId = playerId();
    const remotes = {};     // id -> conn
    const seen = {};        // id -> last message time
    let code = resume ? resume.code : '', dead = false, lastSave = 0;
    if (resume) for (const p of Object.values(game.players)) if (p.id !== meId) seen[p.id] = Date.now();
    Sim.addPlayer(game, meId, name);

    function sendTo(conn, msg) { try { if (conn && conn.open) conn.send(msg); } catch (e) { /* closed */ } }
    function broadcast() {
      const s = Sim.snapshot(game);
      for (const conn of Object.values(remotes)) sendTo(conn, { t: 's', s });
      onSnapshot(s);
      if (Date.now() - lastSave > 1000) save();
    }
    function save() {
      lastSave = Date.now();
      store.set('ukc.host', JSON.stringify({ at: lastSave, name, code, game }), SS());
    }

    function onMsg(conn, msg) {
      if (!msg || typeof msg !== 'object' || dead) return;
      const id = conn.pid;
      if (msg.t === 'hello') {
        if (msg.v !== CONFIG.version) { sendTo(conn, { t: 'version', v: CONFIG.version }); return; }
        const pid = String(msg.id || '').slice(0, 24);
        const old = remotes[pid];
        if (!pid || pid === meId || (old && old !== conn && old.open && old.inst !== msg.inst)) { sendTo(conn, { t: 'dupe' }); return; }
        const res = Sim.addPlayer(game, pid, cleanName(msg.name) || 'Mate');
        if (res.err) { sendTo(conn, { t: res.err }); setTimeout(() => conn.close(), 500); return; }
        if (old && old !== conn) try { old.close(); } catch (e) { /* gone */ }
        conn.pid = pid; conn.inst = msg.inst;
        remotes[pid] = conn; seen[pid] = Date.now();
        sendTo(conn, { t: 'welcome' });
        broadcast();
        return;
      }
      if (!id || remotes[id] !== conn) return;
      seen[id] = Date.now();
      if (Sim.setConnected(game, id, true)) broadcast();
      if (msg.t === 'send' && Sim.send(game, id, msg.from, msg.to)) broadcast();
      else if (msg.t === 'team' && Sim.setTeam(game, id, msg.team)) broadcast();
      else if (msg.t === 'up' && Sim.upgrade(game, id, msg.c)) broadcast();
      else if (msg.t === 'power' && Sim.usePower(game, id, msg.s, msg.c)) broadcast();
    }

    function onClose(conn) {
      if (dead || !conn.pid || remotes[conn.pid] !== conn) return;
      delete remotes[conn.pid];
      if (Sim.setConnected(game, conn.pid, false)) broadcast();
    }

    const net = Net.host({
      onReady(c) { code = c; banner(''); history.replaceState(null, '', '?room=' + c); broadcast(); },
      onConnection(conn) {
        conn.on('data', m => onMsg(conn, m));
        conn.on('close', () => onClose(conn));
        conn.on('error', () => onClose(conn));
      },
      onError(err) { if (!code) { destroy(); toMenu(Net.describe(err)); } else banner(Net.describe(err)); },
    }, resume ? resume.code : null);
    banner(resume ? `Bringing room ${resume.code} back…` : 'Opening a room…');

    // Fixed-step clock. If the tab was asleep, catch up at most 2 seconds rather than fast-forwarding the match.
    let acc = 0, last = performance.now();
    const loop = setInterval(() => {
      const t = performance.now();
      acc = Math.min(acc + (t - last), 2000);
      last = t;
      let changed = false;
      for (const p of Object.values(game.players)) {
        if (p.id !== meId && !p.bot && p.connected && Date.now() - (seen[p.id] || 0) > CONFIG.idleAfterSeconds * 1000) changed = Sim.setConnected(game, p.id, false) || changed;
      }
      while (acc >= CONFIG.tickMs) { acc -= CONFIG.tickMs; if (Sim.step(game)) changed = true; }
      if (changed) broadcast();
    }, CONFIG.tickMs / 2);

    function destroy() { dead = true; clearInterval(loop); if (net) net.destroy(); store.set('ukc.host', '', SS()); }
    function act(type, data) {
      let ok = false;
      if (type === 'send') ok = Sim.send(game, meId, data.from, data.to);
      else if (type === 'start') ok = Sim.start(game);
      else if (type === 'lobby') { Sim.toLobby(game); ok = true; }
      else if (type === 'rematch') ok = Sim.rematch(game);
      else if (type === 'mode') ok = Sim.setMode(game, data);
      else if (type === 'map') ok = Sim.setMapChoice(game, data);
      else if (type === 'team') ok = Sim.setTeam(game, meId, data);
      else if (type === 'upgrade') ok = Sim.upgrade(game, meId, data);
      else if (type === 'power') ok = Sim.usePower(game, meId, data.slot, data.target);
      else if (type === 'shuffle') ok = Sim.shuffleTeams(game);
      else if (type === 'chaos') ok = Sim.setChaos(game, data);
      else if (type === 'bot') ok = Sim.addBot(game);
      else if (type === 'unbot') ok = Sim.removeBot(game, data);
      if (ok) broadcast();
    }
    return { isHost: true, act, destroy, me: meId, get code() { return code; } };
  }

  // =========================================================================
  // CLIENT: sends intents, draws whatever the host sends
  // =========================================================================
  function createClient(name, code) {
    let meId = playerId();
    let net = null, conn = null, dead = false, entered = false, attempts = 0;
    const DELAYS = [1, 1.5, 2, 2.5, 3, 3, 3, 4, 5, 5];
    const s = { isHost: false, act, destroy, code, get me() { return meId; } };

    function connect() {
      net = Net.join(code, {
        onOpen(c) { conn = c; conn.send({ t: 'hello', id: meId, name, inst: INSTANCE, v: CONFIG.version }); },
        onData,
        onClose: lost,
        onError(err) { if (!entered) { destroy(); toMenu(Net.describe(err)); } else lost(); },
      });
    }
    function lost() {
      if (dead) return;
      conn = null;
      if (net) net.destroy();
      if (attempts >= DELAYS.length) { destroy(); toMenu('Lost the host. They may have closed the room.'); return; }
      banner(`Connection lost. Reconnecting… (${attempts + 1}/${DELAYS.length})`);
      setTimeout(() => { if (!dead) connect(); }, DELAYS[attempts++] * 1000);
    }
    function onData(msg) {
      if (!msg || typeof msg !== 'object' || dead) return;
      switch (msg.t) {
        case 'welcome':
          entered = true; attempts = 0; banner('');
          store.set('ukc.room', code, SS());
          history.replaceState(null, '', '?room=' + code);
          break;
        case 's': onSnapshot(msg.s); break;
        case 'dupe': meId = newPlayerId(); conn.send({ t: 'hello', id: meId, name, inst: INSTANCE, v: CONFIG.version }); break;
        case 'full': destroy(); toMenu('That room is full (4 players max).'); break;
        case 'started': destroy(); toMenu('That match has already started.'); break;
        case 'version': destroy(); toMenu(`The host has version ${msg.v} and you have ${CONFIG.version}. Close the tab and open the link again.`); break;
      }
    }
    const beat = setInterval(() => { if (conn && conn.open) try { conn.send({ t: 'ping' }); } catch (e) { /* closed */ } }, 2000);
    function destroy() { dead = true; clearInterval(beat); if (net) net.destroy(); store.set('ukc.room', '', SS()); }
    function act(type, data) {
      if (!conn || !conn.open) return;
      if (type === 'send') conn.send({ t: 'send', from: data.from, to: data.to });
      else if (type === 'team') conn.send({ t: 'team', team: data });
      else if (type === 'upgrade') conn.send({ t: 'up', c: data });
      else if (type === 'power') conn.send({ t: 'power', s: data.slot, c: data.target });
    }
    banner(`Joining ${code}…`);
    connect();
    return s;
  }

  // =========================================================================
  // FLAT SCREENS: menu and lobby
  // =========================================================================
  function toMenu(msg) {
    if (session) session.destroy();
    session = null; snap = null; clockOffset = null;
    Game.teardown();
    menuMsg = msg || '';
    banner('');
    history.replaceState(null, '', location.pathname);
    renderMenu();
  }

  function renderMenu() {
    const name = store.get('ukc.name') || '';
    const room = Net.cleanCode(new URLSearchParams(location.search).get('room') || '');
    $app.innerHTML = `<div class="page">
      <h1>UK<br>Conquest</h1>
      <p class="muted">Take every city in the country. Everyone fights over Birmingham.</p>
      <div class="row" style="gap:8px;margin:6px 0">${CONFIG.players.map((p, i) => `<span class="dot" style="background:${p.colour}">${shapeOf(i)}</span>`).join('')}</div>
      <div class="grow"></div>
      <div class="stack">
        <input id="name" maxlength="12" placeholder="Your name" autocomplete="nickname" value="${esc(name)}">
        <button class="primary" data-act="host">Start a room</button>
        <div class="row"><input id="code" class="code" maxlength="4" placeholder="CODE" value="${esc(room)}" autocapitalize="characters"><button data-act="join">Join</button></div>
        <p class="err">${esc(menuMsg)}</p>
        <p class="muted small center">Version ${CONFIG.version}${Net.available() ? '' : ' · online play unavailable'}</p>
      </div></div>`;
  }

  function readName() {
    const n = cleanName(document.getElementById('name').value);
    if (!n) { menuMsg = 'Pop your name in first.'; renderMenu(); return null; }
    store.set('ukc.name', n);
    return n;
  }

  const playerSlot = (p, badge) => `<div class="slot"><span class="dot" style="background:${p.colour}">${shapeOf(p.idx)}</span>
    <span>${p.bot ? '🤖 ' : ''}${esc(p.name)}${p.id === session.me ? ' <span class="muted small">(you)</span>' : ''}</span><span class="badge">${badge || ''}</span>
    ${p.bot && session.isHost ? `<button class="ghost" data-act="unbot" data-id="${esc(p.id)}" aria-label="Remove bot" style="min-height:36px;padding:0 6px;margin-left:auto">✕</button>` : ''}</div>`;

  function renderLobby(s) {
    const n = s.players.length, teams = s.mode === 'teams';
    const mine = s.players.find(p => p.id === session.me) || {};
    const mapSeg = (s.maps || []).length > 1 ? `<div class="seg">${s.maps.map(m =>
      `<button class="${s.mapId === m.id ? 'on' : ''}" data-act="map" data-map="${m.id}" ${session.isHost ? '' : 'disabled'}>${esc(m.name)}</button>`).join('')}</div>` : '';
    const modes = Object.entries(CONFIG.modes).map(([k, label]) =>
      `<button class="${s.mode === k ? 'on' : ''}" data-act="mode" data-mode="${k}" ${session.isHost ? '' : 'disabled'}>${label}</button>`).join('');
    let roster;
    if (teams) {
      roster = `<div class="teams">${[0, 1].map(t => {
        const ps = s.players.filter(p => p.team === t);
        const empty = Array.from({ length: CONFIG.maxPlayers / 2 - ps.length }, () => '<div class="slot empty">Free seat</div>').join('');
        const join = mine.team !== t && ps.length < CONFIG.maxPlayers / 2 ? `<button class="ghost" data-act="team" data-team="${t}">Join</button>` : '';
        return `<div class="stack"><p class="small center" style="font-weight:900;color:${CONFIG.teamColours[t][0]}">${CONFIG.teamNames[t]}</p>${ps.map(p => playerSlot(p)).join('')}${empty}${join}</div>`;
      }).join('')}</div>
      ${session.isHost ? '<button class="ghost" data-act="shuffle">Shuffle teams</button>' : ''}`;
    } else {
      const slots = [];
      for (let i = 0; i < CONFIG.maxPlayers; i++) {
        const p = s.players.find(q => q.idx === i);
        slots.push(p ? playerSlot(p, CONFIG.players[i].name) : '<div class="slot empty">Waiting for a mate…</div>');
      }
      roster = `<div class="stack">${slots.join('')}</div>`;
    }
    const mins = CONFIG.matchSeconds / 60, ot = CONFIG.overtimeAtSeconds / 60;
    const rule = teams
      ? 'Teammates share a colour, can’t attack each other and can send each other troops.'
      : 'Every player for themselves. Last one standing wins.';
    const startLabel = s.problem ? 'Start' : n >= CONFIG.minPlayers ? `Start with ${n} players` : 'Start a practice run';
    const startNote = s.problem || (n >= CONFIG.minPlayers ? 'Anyone else can still join until you start.' : 'Practice: take every city to win. Better with mates.');
    $app.innerHTML = `<div class="page">
      <p class="muted center" style="margin-top:12px">Room code</p>
      <div class="bigcode">${esc(session.code || '····')}</div>
      <button class="ghost" data-act="share">Copy invite link</button>
      ${mapSeg}
      <div class="seg">${modes}</div>
      <div class="toggle"><span>Chaos events <span class="muted small">(rail strikes, Greggs openings…)</span></span>${session.isHost
        ? `<button data-act="chaos" class="${s.chaos ? 'primary' : ''}">${s.chaos ? 'On' : 'Off'}</button>`
        : `<span class="muted">${s.chaos ? 'On' : 'Off'}</span>`}</div>
      <p class="muted small center">${rule} ${mins} minute limit, then most cities wins. Production speeds up after ${ot} minutes.</p>
      ${roster}
      ${session.isHost && n < CONFIG.maxPlayers ? '<button class="ghost" data-act="bot">+ Add a bot</button>' : ''}
      ${(s.watchers || []).length ? `<p class="muted small center">👀 Watching: ${s.watchers.map(w => esc(w.name)).join(', ')}${s.watchers.some(w => w.id === session.me) ? ' (you). You’ll get a seat when one frees up.' : ''}</p>` : ''}
      <div class="grow"></div>
      ${session.isHost
        ? `<button class="primary" data-act="start" ${s.problem ? 'disabled' : ''}>${startLabel}</button>
           <p class="muted small center">${esc(startNote)}</p>`
        : `<p class="muted small center">${s.problem ? esc(s.problem) + ' ' : ''}The host starts the match.</p>`}
      <button class="ghost" data-act="leave">Leave</button></div>`;
  }

  let lobbyKey = '';
  function show(s, prev) {
    if (s.phase === 'lobby') {
      Game.teardown();
      const key = JSON.stringify([s.players, s.watchers, s.mapId, s.mode, s.problem, s.chaos, session.code]);
      if (!prev || prev.phase !== 'lobby' || key !== lobbyKey || !$app.querySelector('.bigcode')) { lobbyKey = key; renderLobby(s); }
    } else {
      if (!Game.el) Game.build();
      Game.update(s, prev);
    }
  }

  $app.addEventListener('click', e => {
    Sound.unlock();
    const b = e.target.closest('button[data-act]');
    if (!b || b.disabled) return;
    const a = b.dataset.act;
    if (a === 'host' || a === 'join') {
      if (session) return;
      const n = readName();
      if (!n) return;
      if (!Net.available()) { menuMsg = 'Online play is unavailable in this browser.'; renderMenu(); return; }
      if (a === 'host') session = createHost(n);
      else {
        const c = Net.cleanCode(document.getElementById('code').value);
        if (c.length !== 4) { menuMsg = 'Room codes are 4 letters.'; renderMenu(); return; }
        session = createClient(n, c);
      }
    } else if (!session) return;
    else if (a === 'start') session.act('start');
    else if (a === 'lobby') session.act('lobby');
    else if (a === 'rematch') session.act('rematch');
    else if (a === 'mode') session.act('mode', b.dataset.mode);
    else if (a === 'map') session.act('map', b.dataset.map);
    else if (a === 'team') session.act('team', +b.dataset.team);
    else if (a === 'shuffle') session.act('shuffle');
    else if (a === 'chaos') session.act('chaos', !snap.chaos);
    else if (a === 'bot') session.act('bot');
    else if (a === 'unbot') session.act('unbot', b.dataset.id);
    else if (a === 'power') Game.pressPower(+b.dataset.slot);
    else if (a === 'leave') toMenu();
    else if (a === 'mute') b.textContent = Sound.toggle() ? '🔇' : '🔊';
    else if (a === 'share') {
      const url = location.origin + location.pathname + '?room=' + session.code;
      (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(
        () => { b.textContent = 'Link copied'; }, () => { b.textContent = url; });
    }
  });

  // =========================================================================
  // SOUND: tiny Web Audio blips, only after the first tap
  // =========================================================================
  const Sound = (() => {
    let ctx = null, muted = store.get('ukc.muted') === '1';
    function unlock() {
      if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
      try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ctx = null; }
    }
    function tone(f, d, type = 'sine', to = 0, vol = 0.12) {
      if (!ctx || muted) return;
      const t = ctx.currentTime, osc = ctx.createOscillator(), g = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(f, t);
      if (to) osc.frequency.exponentialRampToValueAtTime(to, t + d);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + d);
      osc.connect(g).connect(ctx.destination);
      osc.start(t); osc.stop(t + d + 0.02);
    }
    const SOUNDS = {
      send: () => tone(520, 0.08, 'triangle', 760),
      hold: () => tone(150, 0.18, 'sine', 90, 0.16),
      bounce: () => tone(1200, 0.08, 'square', 600, 0.05),
      tick: () => tone(1000, 0.04, 'square', 0, 0.04),
      lose: () => [392, 330, 262].forEach((f, i) => setTimeout(() => tone(f, 0.25, 'triangle', 0, 0.1), i * 160)),
      news: () => { tone(880, 0.12, 'square', 0, 0.05); setTimeout(() => tone(660, 0.18, 'square', 0, 0.05), 130); },
      upgrade: () => [440, 554, 659].forEach((f, i) => setTimeout(() => tone(f, 0.09, 'triangle', 0, 0.09), i * 60)),
      capture: () => { tone(660, 0.1, 'square', 0, 0.06); setTimeout(() => tone(990, 0.14, 'square', 0, 0.06), 90); },
      lost: () => tone(300, 0.3, 'sawtooth', 120, 0.07),
      win: () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.2, 'triangle'), i * 120)),
    };
    return {
      unlock,
      play(k) { if (SOUNDS[k]) SOUNDS[k](); },
      toggle() { muted = !muted; store.set('ukc.muted', muted ? '1' : '0'); return muted; },
      get muted() { return muted; },
    };
  })();
  addEventListener('pointerdown', () => Sound.unlock(), { capture: true });

  // =========================================================================
  // GAME SCREEN: one canvas for the map, cities, fleets and drags
  // =========================================================================
  const Game = (() => {
    const G = { el: null };
    let cv, ctx, bg, links, raf = 0, W = 0, H = 0, dpr = 1, scale = 1, ox = 0, oy = 0;
    let drag = null;                 // { chain: [city idx], x, y, target } in map units
    const fx = [];                   // capture rings
    const R = { L: 26, M: 22, S: 18 };
    let cities = [], IDX = {}, sea = new Set();
    function loadMap() {
      cities = MAP.cities;
      IDX = {};
      cities.forEach((c, i) => { IDX[c.id] = i; });
      sea = new Set((MAP.seaLinks || []).map(([a, b]) => [IDX[a], IDX[b]].sort().join(',')));
      for (const k of Object.keys(sweep)) delete sweep[k];
    }
    const meIdx = () => { const p = snap && snap.players.find(q => q.id === session.me); return p ? p.idx : -2; };
    const meP = () => snap && snap.players.find(q => q.id === session.me);

    function build() {
      loadMap();
      $app.innerHTML = `<div class="game">
        <div class="topbar"><span class="timer">0:00</span><button class="ghost" data-act="mute" style="min-height:32px;padding:0 4px;font-size:18px">${Sound.muted ? '🔇' : '🔊'}</button><div class="chips"></div></div>
        <div class="board"><canvas></canvas><div class="chaosbar"></div><div class="powers"></div><div class="news"></div><div class="toast"></div></div>
      </div>`;
      G.el = $app.querySelector('.game');
      cv = G.el.querySelector('canvas');
      ctx = cv.getContext('2d');
      cv.addEventListener('pointerdown', down);
      cv.addEventListener('pointermove', move);
      cv.addEventListener('pointerup', up);
      cv.addEventListener('pointercancel', () => { drag = null; });
      addEventListener('resize', resize);
      resize();
      raf = requestAnimationFrame(frame);
    }
    function teardown() {
      if (!G.el) return;
      cancelAnimationFrame(raf);
      removeEventListener('resize', resize);
      G.el = null; drag = null; fx.length = 0;
    }

    function resize() {
      const box = cv.parentNode.getBoundingClientRect();
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = box.width; H = box.height;
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      const pad = 8;
      scale = Math.min((W - pad * 2) / MAP.width, (H - pad * 2) / MAP.height);
      ox = (W - MAP.width * scale) / 2; oy = (H - MAP.height * scale) / 2;
      drawBackground();
      if (MAP.territories) buildRegions();
    }
    const sx = x => ox + x * scale, sy = y => oy + y * scale;
    const landPolys = () => [...MAP.land, ...MAP.ni, ...(MAP.islands || [])];

    // ---- territories: every land pixel belongs to its nearest city (a Voronoi split of the UK) ----
    let region = null, borders = null, terr = null, terrKey = '';
    function buildRegions() {
      const w = cv.width, h = cv.height;
      const m = document.createElement('canvas');
      m.width = w; m.height = h;
      const mc = m.getContext('2d');
      mc.setTransform(dpr, 0, 0, dpr, 0, 0);
      mc.fillStyle = '#000';
      for (const p of landPolys()) { poly(mc, p); mc.fill(); }
      const alpha = mc.getImageData(0, 0, w, h).data;
      const cx = cities.map(c => sx(c.x) * dpr), cy = cities.map(c => sy(c.y) * dpr);
      region = new Int8Array(w * h).fill(-1);
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const k = y * w + x;
          if (alpha[k * 4 + 3] < 128) continue;
          let best = 0, bd = Infinity;
          for (let i = 0; i < cx.length; i++) {
            const dx = cx[i] - x, dy = cy[i] - y, d = dx * dx + dy * dy;
            if (d < bd) { bd = d; best = i; }
          }
          region[k] = best;
        }
      }
      // Border pixels: land next to a different city's land.
      const b = [];
      for (let y = 0; y < h - 1; y++) {
        for (let x = 0; x < w - 1; x++) {
          const k = y * w + x, r = region[k];
          if (r < 0) continue;
          const rr = region[k + 1], rd = region[k + w];
          if ((rr >= 0 && rr !== r) || (rd >= 0 && rd !== r)) b.push(k);
        }
      }
      borders = Int32Array.from(b);
      terr = document.createElement('canvas');
      terr.width = w; terr.height = h;
      terrKey = '';
    }
    const hexRgb = hex => [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
    // Repaint the territory tint only when ownership (or colours) changed.
    function paintTerritories() {
      if (!terr || !snap || !snap.c.length) return;
      const owners = snap.c.map(c => c[0]);
      const key = owners.join() + '|' + snap.players.map(p => p.colour).join();
      if (key === terrKey) return;
      terrKey = key;
      const w = terr.width, h = terr.height, tc = terr.getContext('2d');
      const img = tc.createImageData(w, h), d = img.data;
      const tint = owners.map(o => (o >= 0 ? hexRgb(colourOf(o)) : null));
      for (let k = 0; k < region.length; k++) {
        const r = region[k];
        if (r < 0) continue;
        const t = tint[r];
        if (!t) continue;
        const j = k * 4;
        d[j] = t[0]; d[j + 1] = t[1]; d[j + 2] = t[2]; d[j + 3] = 135;
      }
      for (const k of borders) {
        const j = k * 4;
        d[j] = 31; d[j + 1] = 42; d[j + 2] = 51; d[j + 3] = 95;
      }
      tc.putImageData(img, 0, 0);
    }
    // The city whose territory is under this map point, or -1 (sea).
    function regionAt(pt) {
      if (!region) return -1;
      const x = Math.round(sx(pt.x) * dpr), y = Math.round(sy(pt.y) * dpr);
      if (x < 0 || y < 0 || x >= cv.width || y >= cv.height) return -1;
      return region[y * cv.width + x];
    }

    function poly(c, pts) {
      c.beginPath();
      pts.forEach(([x, y], i) => (i ? c.lineTo(sx(x), sy(y)) : c.moveTo(sx(x), sy(y))));
      c.closePath();
    }
    // Sea, land and links don't change, so they're drawn once per resize.
    function drawBackground() {
      bg = document.createElement('canvas');
      bg.width = cv.width; bg.height = cv.height;
      const c = bg.getContext('2d');
      c.setTransform(dpr, 0, 0, dpr, 0, 0);
      c.fillStyle = '#9fcfe3'; c.fillRect(0, 0, W, H);
      c.lineJoin = 'round';
      // Land that's not in play (Ireland; Wales and Scotland on the England map) in a quieter colour.
      for (const p of [...(MAP.ireland || []), ...(MAP.foreign || [])]) { poly(c, p); c.fillStyle = '#e4e2d2'; c.fill(); }
      for (const p of landPolys()) {
        poly(c, p); c.fillStyle = '#f3ecd3'; c.fill();
        c.strokeStyle = 'rgba(31,42,51,0.25)'; c.lineWidth = 1.5; c.stroke();
      }
      // Links go on their own layer so territory tints sit underneath them.
      links = document.createElement('canvas');
      links.width = cv.width; links.height = cv.height;
      drawLinks(links.getContext('2d'));
    }
    function drawLinks(c) {
      c.setTransform(dpr, 0, 0, dpr, 0, 0);
      c.lineCap = 'round';
      for (const [a, b] of MAP.links) {
        const i = IDX[a], j = IDX[b];
        c.beginPath(); c.moveTo(sx(cities[i].x), sy(cities[i].y)); c.lineTo(sx(cities[j].x), sy(cities[j].y));
        const isSea = sea.has([i, j].sort().join(','));
        c.setLineDash(isSea ? [6, 6] : []);
        c.strokeStyle = isSea ? 'rgba(31,42,51,0.35)' : 'rgba(31,42,51,0.18)';
        c.lineWidth = Math.max(2, 5 * scale);
        c.stroke();
      }
      c.setLineDash([]);
    }

    // ---- input ----
    function toMap(e) {
      const r = cv.getBoundingClientRect();
      return { x: (e.clientX - r.left - ox) / scale, y: (e.clientY - r.top - oy) / scale };
    }
    // Nearest city within a forgiving radius (at least 26px on screen, so a 52px target).
    function hitCity(pt) {
      let best = -1, bd = Infinity;
      cities.forEach((c, i) => {
        const d = Math.hypot(c.x - pt.x, c.y - pt.y), reach = Math.max(R[c.size] + 8, 26 / scale);
        if (d < reach && d < bd) { bd = d; best = i; }
      });
      return best;
    }
    // Starting a drag or picking a target also works anywhere in a city's territory.
    function hit(pt) {
      const i = hitCity(pt);
      return i >= 0 ? i : regionAt(pt);
    }
    const mine = i => snap && snap.c[i] && snap.c[i][0] === meIdx();
    function down(e) {
      if (!snap || snap.phase !== 'play' || (meP() && meP().out)) return;
      const pt = toMap(e), i = hit(pt);
      if (armed) { aimPower(i); return; }
      if (i < 0 || !mine(i)) return;
      try { cv.setPointerCapture(e.pointerId); } catch (err) { /* synthetic or already released */ }
      drag = { chain: [i], x: pt.x, y: pt.y, target: -1, sx: e.clientX, sy: e.clientY, at: performance.now(), wandered: false };
    }
    // ---- power-ups: speed fires at once; shield and sabotage wait for you to tap a city ----
    const POWER = {
      speed: { icon: '⚡', name: 'Speed', hint: '' },
      shield: { icon: '🛡️', name: 'Shield', hint: 'Tap one of your cities to shield it' },
      sabotage: { icon: '🔧', name: 'Sabotage', hint: 'Tap an enemy city to stop its production' },
    };
    let armed = null;   // { slot, kind }
    function pressPower(slot) {
      const p = meP();
      if (!p || !snap || snap.phase !== 'play') return;
      const kind = p.powers[slot];
      if (!kind) return;
      if (armed && armed.slot === slot) { armed = null; toast('Cancelled'); renderPowers(true); return; }
      if (kind === 'speed') {
        session.act('power', { slot });
        Sound.play('upgrade'); buzz(20);
        toast(`⚡ Troops you send go twice as fast for ${CONFIG.powerups.speed.seconds}s`);
        return;
      }
      armed = { slot, kind };
      toast(POWER[kind].hint);
      renderPowers(true);
    }
    function aimPower(i) {
      const { slot, kind } = armed;
      armed = null;
      renderPowers(true);
      if (i < 0) { toast('Cancelled'); return; }
      const o = snap.c[i][0];
      if (kind === 'shield' && o !== meIdx()) { toast('Shields only go on your own cities'); return; }
      if (kind === 'sabotage' && (o < 0 || friendly(o))) { toast('Sabotage only works on an enemy city'); return; }
      session.act('power', { slot, target: i });
      Sound.play('upgrade'); buzz(20);
    }
    let powersKey = '';
    function renderPowers(force) {
      const p = meP(), el = G.el && G.el.querySelector('.powers');
      if (!el) return;
      const live = !!p && snap.phase === 'play' && !p.out;
      const key = live ? JSON.stringify([p.powers, p.charge, armed]) : '';
      if (!force && key === powersKey) return;
      powersKey = key;
      if (!live) { el.innerHTML = ''; return; }
      const need = CONFIG.powerups.capturesPerPowerup;
      const charge = p.powers.length < CONFIG.powerups.maxHeld
        ? `<span class="charge" title="Captures until the next power-up">${Array.from({ length: need }, (_, k) => `<i class="${k < p.charge ? 'on' : ''}"></i>`).join('')}</span>`
        : '';
      el.innerHTML = charge + p.powers.map((k, slot) =>
        `<button data-act="power" data-slot="${slot}" class="${armed && armed.slot === slot ? 'armed' : ''}" aria-label="${POWER[k].name}">${POWER[k].icon}<small>${POWER[k].name}</small></button>`).join('');
    }

    // A quick tap on your own city (no drag) upgrades it.
    function tapUpgrade(i) {
      const [, n, lv] = snap.c[i];
      if (lv >= CONFIG.maxLevel) { toast(`${cities[i].name} is already max level`); return; }
      const cost = CONFIG.upgradeCost[lv + 1];
      if (n < cost + 1) { toast(`Level ${lv + 1} costs ${cost} troops (and one stays behind)`); return; }
      session.act('upgrade', i);
      Sound.play('upgrade'); buzz(20);
    }
    function move(e) {
      if (!drag) return;
      const pt = toMap(e);
      drag.x = pt.x; drag.y = pt.y;
      if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 12) drag.wandered = true;
      // Only passing over a city itself adds it to the chain, so crossing your own land doesn't.
      const i = hit(pt), on = hitCity(pt);
      if (on >= 0 && mine(on) && !drag.chain.includes(on)) drag.chain.push(on);
      drag.target = i;
    }
    function up(e) {
      if (!drag) return;
      move(e);
      if (!drag.wandered && drag.chain.length === 1 && performance.now() - drag.at < 500) {
        const i = drag.chain[0];
        drag = null;
        tapUpgrade(i);
        return;
      }
      const to = drag.target, from = drag.chain.filter(i => i !== to);
      drag = null;
      if (to < 0 || !from.length || !reachable(from).has(to)) return;
      if (!from.some(i => snap.c[i][1] >= 2)) { toast('Not enough troops to send'); return; }
      session.act('send', { from, to });
      Sound.play('send'); buzz(10);
    }
    // Yours, or your teammate's in 2 v 2.
    function friendly(o) {
      const me = meIdx();
      if (o === me) return true;
      if (snap.mode !== 'teams' || o < 0) return false;
      const a = snap.players.find(q => q.idx === o), b = meP();
      return !!a && !!b && a.team === b.team;
    }
    // Cities the sources can reach: along links, passing only through friendly cities.
    function reachable(from) {
      const out = new Set(), seen = new Set(from), q = [...from];
      while (q.length) {
        const u = q.shift();
        for (const v of Sim.adj(u)) {
          if (isBlocked(u, v)) continue;
          out.add(v);
          if (!seen.has(v) && friendly(snap.c[v][0])) { seen.add(v); q.push(v); }
        }
      }
      from.forEach(i => out.delete(i));
      for (const i of from) for (const j of from) if (i !== j) out.add(j);
      return out;
    }
    const isBlocked = (u, v) => {
      const key = u < v ? u + ',' + v : v + ',' + u;
      return (snap.on || []).some(e => e.links && e.links.includes(key));
    };
    const CHAOS_ICON = { railStrike: '🚆', bankHoliday: '🎉', stormGerald: '🌧️', greggs: '🥐', heatwave: '☀️' };
    const CHAOS_NAME = { railStrike: 'Rail strike', bankHoliday: 'Bank holiday', stormGerald: 'Storm Gerald', heatwave: 'Heatwave' };
    let newsTimer = 0;
    // A headline that drops in from the top for a few seconds.
    function news(kind, text) {
      const el = G.el && G.el.querySelector('.news');
      if (!el) return;
      el.innerHTML = `<span class="big">${CHAOS_ICON[kind] || '📰'}</span>${esc(text)}`;
      el.classList.add('show');
      clearTimeout(newsTimer);
      newsTimer = setTimeout(() => el.classList.remove('show'), 4000);
      Sound.play('news'); buzz([30, 30, 30]);
    }
    let toastTimer = 0;
    function toast(t) {
      const el = G.el && G.el.querySelector('.toast');
      if (!el) return;
      el.textContent = t;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { el.textContent = ''; }, 1800);
    }

    // ---- snapshot -> DOM bits and effects ----
    let lastEv = 0, lastBeep = -1;
    const sweep = {};        // city -> { from colour, at }: a new owner's colour spreads out from the middle
    let shakeAt = 0, shakeMag = 0;
    function shake(mag) {
      if (reduced()) return;
      const t = performance.now();
      shakeMag = Math.max(mag, t - shakeAt < 300 ? shakeMag : 0);
      shakeAt = t;
    }
    // Confetti in the winner's colour, capped so phones stay smooth.
    const confetti = [];
    function throwConfetti(colour, count) {
      if (reduced()) return;
      const cols = [colour, '#ffffff', '#f3ecd3'];
      for (let k = 0; k < count && confetti.length < 140; k++) {
        confetti.push({ x: Math.random() * W, y: -10 - Math.random() * H * 0.4, vx: (Math.random() - 0.5) * 60, vy: 60 + Math.random() * 120,
          r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, s: 4 + Math.random() * 5, c: cols[k % cols.length] });
      }
    }
    function update(s, prev) {
      const me = meIdx();
      const chips = s.players.map(p => `<span class="chip ${p.id === session.me ? 'me' : ''} ${p.out ? 'out' : ''} ${p.connected ? '' : 'away'}" style="color:${colourOf(p.idx)}" title="${esc(p.name)}">
        <span class="dot" style="background:${colourOf(p.idx)}">${shapeOf(p.idx)}</span><span style="color:var(--ink)">${p.cities}</span></span>`).join('');
      const watching = !s.players.some(p => p.id === session.me);
      const $chips = G.el.querySelector('.chips');
      const allChips = (watching ? '<span class="chip" style="color:var(--ink)">👀 Watching</span>' : '') + chips;
      if ($chips.dataset.h !== allChips) { $chips.innerHTML = allChips; $chips.dataset.h = allChips; }
      // Counts down to the time limit; turns orange once overtime production kicks in.
      const sec = Math.max(0, Math.ceil((s.end - s.t) / 1000));
      const $timer = G.el.querySelector('.timer');
      $timer.textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}${s.ot ? ' ⚡' : ''}`;
      $timer.classList.toggle('ot', !!s.ot);
      $timer.classList.toggle('last', s.phase === 'play' && sec <= 10);
      if (s.phase === 'play' && sec <= 10 && sec > 0 && sec !== lastBeep) { lastBeep = sec; Sound.play('tick'); }
      // What's on right now, with seconds left.
      const bar = (s.on || []).map(e => `<span>${CHAOS_ICON[e.k] || ''} ${CHAOS_NAME[e.k] || e.k} ${Math.max(0, Math.ceil((e.until - s.t) / 1000))}s</span>`).join('');
      const $bar = G.el.querySelector('.chaosbar');
      if ($bar.innerHTML !== bar) $bar.innerHTML = bar;
      if (s.phase !== 'play') armed = null;
      renderPowers();

      if (prev && prev.phase === 'play') {
        for (const e of s.ev) {
          if (e.id <= lastEv) continue;
          if (e.k === 'cap') {
            const c = cities[e.c];
            sweep[e.c] = { from: colourOf(e.was), at: performance.now() };
            if (e.was === me && e.lost >= 15) shake(7);
            else if (e.o === me && e.lost >= 25) shake(4);
            fx.push({ x: c.x, y: c.y, colour: colourOf(e.o), at: performance.now() });
            if (fx.length > 12) fx.shift();
            if (e.o === me) { Sound.play('capture'); buzz(30); }
            else if (e.was === me) { Sound.play('lost'); buzz([60, 40, 60]); }
          } else if (e.k === 'hold' && e.by === me) {
            Sound.play('hold');
            if (e.n >= 25) shake(5);
          } else if (e.k === 'power' && e.o === me) {
            toast(`New power-up: ${POWER[e.kind].icon} ${POWER[e.kind].name}`); Sound.play('capture'); buzz([20, 30, 20]);
          } else if (e.k === 'used' && e.kind === 'sabotage' && e.on === me) {
            toast(`🔧 Sabotage! ${cities[e.c].name} has stopped producing`); Sound.play('lost'); buzz([60, 40, 60]);
          } else if (e.k === 'bounce') {
            const c = cities[e.c];
            fx.push({ x: c.x, y: c.y, colour: '#ffffff', at: performance.now() });
            Sound.play('bounce');
            if (e.by === me) toast(`🛡️ ${c.name} is shielded. Your troops bounced off`);
          } else if (e.k === 'chaos') {
            news(e.kind, e.text);
            if (e.c !== undefined) { const c = cities[e.c]; fx.push({ x: c.x, y: c.y, colour: '#c8102e', at: performance.now() }); }
          } else if (e.k === 'up') {   // everyone sees an upgrade happen
            const c = cities[e.c];
            fx.push({ x: c.x, y: c.y, colour: '#ffffff', at: performance.now() });
            if (fx.length > 12) fx.shift();
          } else if (e.k === 'out' && e.o === me) toast("You've been wiped off the map");
          else if (e.k === 'ot') { toast(`Overtime: production ×${CONFIG.overtimeBoost}`); Sound.play('send'); buzz(40); }
        }
      }
      for (const e of s.ev) lastEv = Math.max(lastEv, e.id);
      if (prev && prev.phase !== s.phase) lastEv = s.ev.reduce((m, e) => Math.max(m, e.id), 0);

      const p = meP();
      let over = G.el.querySelector('.overlay');
      if (s.phase === 'over') {
        if (!over) {
          drag = null;
          G.el.querySelector('.board').insertAdjacentHTML('beforeend', endScreen(s));
          if (iWon(s)) Sound.play('win'); else Sound.play('lose');
          const wc = s.mode === 'teams' ? (s.winTeam !== null ? CONFIG.teamColours[s.winTeam][0] : null) : (s.winner !== null ? colourOf(s.winner) : null);
          if (wc) throwConfetti(wc, iWon(s) ? 140 : 50);
          buzz(iWon(s) ? [40, 60, 40, 60, 120] : [200]);
        }
      } else if (over) over.remove();
      if (p && p.out && s.phase === 'play' && !(prev && meIdxOut(prev))) toast("You're out. Watching the rest.");
    }
    function iWon(s) {
      const p = s.players.find(q => q.id === session.me);
      if (!p) return false;
      return s.mode === 'teams' ? s.winTeam === p.team : s.winner === p.idx;
    }
    const AWARDS = {
      taken: { ico: '🏴', title: 'Most Cities Taken', say: v => `${v} captured` },
      comeback: { ico: '📈', title: 'Biggest Comeback', say: v => `climbed back ${v} cities` },
      prize: { ico: '🏙️', title: () => `Baron of ${(cities.find(c => c.id === MAP.prizeCity) || {}).name || 'the Midlands'}`, say: v => `held it for ${v}s` },
      upgrades: { ico: '🏗️', title: 'Planning Permission', say: v => `${v} upgrades` },
      gifted: { ico: '🤝', title: 'Top Teammate', say: v => `sent ${v} troops to their mate` },
      betrayer: { ico: '🐍', title: 'Betrayer', say: () => 'left their teammate to it' },
    };
    function awardsHtml(s) {
      const list = (s.awards || []).filter(a => AWARDS[a.k]);
      if (!list.length) return '';
      return `<div class="awards">${list.map((a, k) => {
        const p = s.players.find(q => q.idx === a.o) || { name: '?', colour: CONFIG.neutralColour, idx: 0 };
        const A = AWARDS[a.k], title = typeof A.title === 'function' ? A.title() : A.title;
        return `<div class="award" style="animation-delay:${0.3 + k * 0.35}s"><span class="ico">${A.ico}</span>
          <div><b>${title}</b><span class="who"><span class="dot" style="display:inline-grid;width:16px;height:16px;font-size:9px;vertical-align:-3px;background:${p.colour}">${shapeOf(p.idx)}</span> ${esc(p.name)}, ${A.say(a.v)}</span></div></div>`;
      }).join('')}</div>`;
    }
    function endScreen(s) {
      const teams = s.mode === 'teams', won = iWon(s);
      const w = s.players.find(q => q.idx === s.winner);
      const how = s.endReason === 'time' ? 'on cities when the clock ran out' : s.endReason === 'elimination' ? 'by wiping out the rest' : '';
      let title;
      if (s.endReason === 'draw') title = 'Dead heat';
      else if (teams) title = s.winTeam === null ? 'Nobody left standing' : won ? 'Your team conquered the UK!' : `${CONFIG.teamNames[s.winTeam]} conquered the UK`;
      else title = !w ? 'Nobody left standing' : won ? 'You conquered the UK!' : `${esc(w.name)} conquered the UK`;
      const sub = s.endReason === 'draw' ? 'Same cities, same troops. Honours even, which nobody likes.'
        : won ? `Long live the monarch of Birmingham. Won ${how}.` : `Better luck next time. Won ${how}.`;
      const isWin = q => (teams ? q.team === s.winTeam : q.idx === s.winner);
      const rows = [...s.players].sort((a, b) => isWin(b) - isWin(a) || b.cities - a.cities || (b.stats ? b.stats.taken : 0) - (a.stats ? a.stats.taken : 0))
        .map(q => {
          const st = q.stats || {};
          return `<tr><td><span class="who"><span class="dot" style="background:${q.colour}">${shapeOf(q.idx)}</span>${esc(q.name)}${isWin(q) ? ' 👑' : ''}</span></td>
            <td>${q.cities}</td><td>${st.taken || 0}</td><td>${st.lost || 0}</td><td>${st.peak || 0}</td><td>${st.upgrades || 0}</td><td>${st.sent || 0}</td></tr>`;
        }).join('');
      const t = Math.round(s.t / 1000);
      return `<div class="overlay"><div class="box">
        <h2>${title}</h2>
        <p class="muted small">${sub} ${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')} played.</p>
        ${awardsHtml(s)}
        <table class="stats"><tr><th></th><th>Now</th><th>Taken</th><th>Lost</th><th>Peak</th><th>Upgr.</th><th>Sent</th></tr>${rows}</table>
        ${session.isHost
          ? '<button class="primary" data-act="rematch">Rematch</button><button data-act="lobby">Back to the lobby</button>'
          : '<p class="muted small">Waiting for the host to call a rematch…</p>'}
        <button class="ghost" data-act="leave">Leave</button></div></div>`;
    }
    const meIdxOut = s => { const p = s.players.find(q => q.id === session.me); return p && p.out; };

    // ---- per-frame drawing ----
    function pointAlong(path, dist) {
      for (let k = 0; k < path.length - 1; k++) {
        const a = cities[path[k]], b = cities[path[k + 1]], l = Sim.linkLen(path[k], path[k + 1]);
        if (dist <= l || k === path.length - 2) { const f = Math.max(0, Math.min(1, dist / l)); return [a.x + (b.x - a.x) * f, a.y + (b.y - a.y) * f]; }
        dist -= l;
      }
      return [cities[path[0]].x, cities[path[0]].y];
    }
    function pathLen(path) { let l = 0; for (let k = 0; k < path.length - 1; k++) l += Sim.linkLen(path[k], path[k + 1]); return l; }

    function frame() {
      raf = requestAnimationFrame(frame);
      if (!snap || !bg) return;
      const c = ctx, now = simNow(), me = meIdx();
      const st = performance.now() - shakeAt;
      cv.style.transform = st < 300 ? `translate(${(Math.random() - 0.5) * shakeMag * (1 - st / 300)}px, ${(Math.random() - 0.5) * shakeMag * (1 - st / 300)}px)` : '';
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.drawImage(bg, 0, 0);
      paintTerritories();
      if (terr) c.drawImage(terr, 0, 0);
      c.drawImage(links, 0, 0);
      // Lines shut by a rail strike or a storm: red dashes with a cross in the middle.
      c.setTransform(dpr, 0, 0, dpr, 0, 0);
      for (const e of snap.on || []) for (const key of e.links || []) {
        const [i, j] = key.split(',').map(Number), a = cities[i], b = cities[j];
        c.strokeStyle = '#c8102e'; c.lineWidth = Math.max(2.5, 5 * scale); c.setLineDash([6, 5]);
        c.beginPath(); c.moveTo(sx(a.x), sy(a.y)); c.lineTo(sx(b.x), sy(b.y)); c.stroke();
        c.setLineDash([]);
        const mx = sx((a.x + b.x) / 2), my = sy((a.y + b.y) / 2), k = 6;
        c.lineWidth = 3.5;
        c.beginPath(); c.moveTo(mx - k, my - k); c.lineTo(mx + k, my + k); c.moveTo(mx + k, my - k); c.lineTo(mx - k, my + k); c.stroke();
      }
      c.setTransform(dpr, 0, 0, dpr, 0, 0);

      // Drag lines and valid targets.
      let valid = null;
      if (drag) {
        valid = reachable(drag.chain);
        const tgt = drag.target >= 0 && valid.has(drag.target) ? cities[drag.target] : null;
        c.strokeStyle = colourOf(me); c.lineWidth = Math.max(3, 7 * scale); c.lineCap = 'round'; c.globalAlpha = 0.75;
        for (const i of drag.chain) {
          if (tgt && i === drag.target) continue;
          c.beginPath(); c.moveTo(sx(cities[i].x), sy(cities[i].y));
          c.lineTo(sx(tgt ? tgt.x : drag.x), sy(tgt ? tgt.y : drag.y)); c.stroke();
        }
        c.globalAlpha = 1;
      }

      // Fleets: a stream of dots along the route.
      const dotR = Math.max(2.5, 5 * scale), gap = 9;
      for (const [, o, n, t0, t1, path] of snap.f) {
        const len = pathLen(path), head = len * Math.max(0, Math.min(1, (now - t0) / (t1 - t0)));
        const dots = Math.min(12, Math.max(2, Math.ceil(n / 3)));
        c.fillStyle = colourOf(o);
        for (let k = 0; k < dots; k++) {
          const d = head - k * gap;
          if (d < 0) break;
          const [x, y] = pointAlong(path, d);
          c.beginPath(); c.arc(sx(x), sy(y), dotR, 0, Math.PI * 2); c.fill();
        }
        const [hx, hy] = pointAlong(path, head);
        c.font = `800 ${Math.max(11, Math.round(14 * scale))}px system-ui, sans-serif`;
        c.textAlign = 'center'; c.textBaseline = 'bottom';
        c.lineWidth = 3; c.strokeStyle = 'rgba(255,255,255,0.9)'; c.strokeText(n, sx(hx), sy(hy) - dotR - 1);
        c.fillStyle = colourOf(o); c.fillText(n, sx(hx), sy(hy) - dotR - 1);
      }

      // Capture rings.
      const t = performance.now();
      for (let k = fx.length - 1; k >= 0; k--) {
        const f = fx[k], a = (t - f.at) / 600;
        if (a >= 1) { fx.splice(k, 1); continue; }
        c.strokeStyle = f.colour; c.globalAlpha = 1 - a; c.lineWidth = 4;
        c.beginPath(); c.arc(sx(f.x), sy(f.y), (30 + 40 * a) * scale, 0, Math.PI * 2); c.stroke();
        c.globalAlpha = 1;
      }

      // Cities.
      const numFont = s => `900 ${Math.round(s)}px system-ui, sans-serif`;
      cities.forEach((m, i) => {
        const [o, n, lv = 1] = snap.c[i] || [-1, 0, 1];
        const x = sx(m.x), y = sy(m.y), r = R[m.size] * scale;
        if (valid && valid.has(i)) {
          c.beginPath(); c.arc(x, y, r + 6, 0, Math.PI * 2);
          c.fillStyle = drag.target === i ? colourOf(me) : 'rgba(255,255,255,0.75)'; c.globalAlpha = drag.target === i ? 0.5 : 1; c.fill(); c.globalAlpha = 1;
        }
        const sw = sweep[i], sp = sw ? (performance.now() - sw.at) / 450 : 1;
        if (sp < 1) {   // old colour underneath, the new owner's colour growing out of the middle
          c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fillStyle = sw.from; c.fill();
          c.beginPath(); c.arc(x, y, r * (1 - Math.pow(1 - sp, 3)), 0, Math.PI * 2); c.fillStyle = colourOf(o); c.fill();
        } else if (sw) delete sweep[i];
        c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2);
        if (sp >= 1) { c.fillStyle = colourOf(o); c.fill(); }
        c.lineWidth = drag && drag.chain.includes(i) ? 4 : 2.5;
        c.strokeStyle = drag && drag.chain.includes(i) ? '#1f2a33' : '#fff'; c.stroke();
        const p = o >= 0 && snap.players.find(q => q.idx === o);
        if (p && p.frozen) { c.fillStyle = 'rgba(255,255,255,0.45)'; c.fill(); }
        const [, , , shield, sabot] = snap.c[i] || [];
        if (sabot) { c.fillStyle = 'rgba(160,200,230,0.6)'; c.fill(); }
        if (shield) {   // a bright double ring
          c.strokeStyle = '#fff'; c.lineWidth = 3;
          c.beginPath(); c.arc(x, y, r + 5, 0, Math.PI * 2); c.stroke();
          c.strokeStyle = '#56B4E9'; c.lineWidth = 2;
          c.beginPath(); c.arc(x, y, r + 8, 0, Math.PI * 2); c.stroke();
        }
        if (armed) {   // where the armed power-up can go
          const ok = armed.kind === 'shield' ? o === me : o >= 0 && !friendly(o);
          if (ok) { c.strokeStyle = '#1f2a33'; c.lineWidth = 2; c.setLineDash([4, 4]); c.beginPath(); c.arc(x, y, r + 11, 0, Math.PI * 2); c.stroke(); c.setLineDash([]); }
        }
        c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle';
        c.font = numFont(Math.max(12, r * (n >= 100 ? 0.8 : 0.95)));
        c.fillText(n, x, y + 1);
        if (o >= 0) {   // owner's shape, as a backup to colour
          c.font = `${Math.max(8, Math.round(r * 0.42))}px system-ui, sans-serif`;
          c.fillText(shapeOf(o), x, y - r * 0.68);
        }
        if (lv > 1) {   // level pips along the bottom of the circle
          const pr = Math.max(2, r * 0.11), gap = pr * 2.8;
          for (let k = 0; k < lv; k++) {
            c.beginPath(); c.arc(x + (k - (lv - 1) / 2) * gap, y + r * 0.7, pr, 0, Math.PI * 2);
            c.fillStyle = '#fff'; c.fill();
          }
        }
        c.font = `700 ${Math.max(9, Math.round(11 * scale + 3))}px system-ui, sans-serif`;
        c.textBaseline = 'top';
        c.lineWidth = 3; c.strokeStyle = 'rgba(243,236,211,0.9)';
        c.strokeText(m.name, x, y + r + 2);
        c.fillStyle = '#1f2a33'; c.fillText(m.name, x, y + r + 2);
      });
      drawConfetti(c);
    }

    function drawConfetti(c) {
      if (!confetti.length) return;
      const dt = 1 / 60;
      for (let k = confetti.length - 1; k >= 0; k--) {
        const p = confetti[k];
        p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
        if (p.y > H + 20) { confetti.splice(k, 1); continue; }
        c.save(); c.translate(p.x, p.y); c.rotate(p.r); c.fillStyle = p.c; c.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); c.restore();
      }
    }
    return Object.assign(G, { build, teardown, update, pressPower });
  })();

  // A refresh brings you back: the host re-opens the same room, a player rejoins it.
  (function resume() {
    let saved = null;
    try { saved = JSON.parse(store.get('ukc.host', SS()) || 'null'); } catch (e) { saved = null; }
    if (saved && saved.code && Date.now() - saved.at < 120000 && Net.available()) { session = createHost(saved.name, saved); return; }
    const room = store.get('ukc.room', SS());
    const name = store.get('ukc.name');
    if (room && name && Net.available()) { session = createClient(name, room); return; }
    renderMenu();
  })();
})();
</script>
</body>
