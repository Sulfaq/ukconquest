<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#9fcfe3">
<title>UK Conquest</title>
<style>
:root {
  --bg: #fbf7ec; --ink: #1f2a33; --soft: #6b7780; --line: #e3dccb; --card: #ffffff;
  --accent: #d55e00; --sea: #9fcfe3; --bad: #c23b22;
  --sticker: 3px 4px 0 rgba(31, 42, 51, 0.18);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 18px/1.45 ui-rounded, "SF Pro Rounded", "Segoe UI Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  overscroll-behavior: none;
}
#app { min-height: 100%; }
.page { width: 100%; max-width: 480px; min-height: 100vh; min-height: 100dvh; margin: 0 auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; }
h1 { font-size: 46px; line-height: 1; margin: 28px 0 4px; letter-spacing: -1px; font-weight: 900; }
h2 { font-size: 26px; line-height: 1.2; margin: 0; font-weight: 900; }
p { margin: 0; }
.muted { color: var(--soft); }
.small { font-size: 15px; }
.grow { flex: 1; }
.center { text-align: center; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 10px; align-items: center; }
button, input {
  font: inherit; min-height: 56px; border-radius: 16px; border: 3px solid var(--ink);
  padding: 12px 18px; background: var(--card); color: var(--ink); box-shadow: var(--sticker);
}
button { cursor: pointer; font-weight: 800; touch-action: manipulation; }
button:active:not(:disabled) { transform: translate(2px, 3px); box-shadow: 1px 1px 0 rgba(31, 42, 51, 0.18); }
button:disabled { opacity: 0.45; cursor: default; }
button.primary { background: var(--accent); color: #fff; }
button.ghost { background: transparent; box-shadow: none; border-color: transparent; color: var(--soft); }
input { width: 100%; box-shadow: none; }
input.code { text-transform: uppercase; letter-spacing: 6px; text-align: center; font-weight: 900; }
.err { color: var(--bad); min-height: 1.4em; }
.bigcode { font-size: 56px; font-weight: 900; letter-spacing: 10px; text-align: center; }
.slot { display: flex; gap: 12px; align-items: center; background: var(--card); border: 3px solid var(--ink); border-radius: 16px; padding: 8px 14px; min-height: 58px; font-weight: 800; box-shadow: var(--sticker); }
.slot.empty { background: transparent; border: 3px dashed var(--line); color: var(--soft); font-weight: 600; box-shadow: none; }
.slot .badge { margin-left: auto; font-size: 14px; color: var(--soft); font-weight: 700; }
.seg { display: flex; gap: 0; border: 3px solid var(--ink); border-radius: 16px; overflow: hidden; box-shadow: var(--sticker); }
.seg button { flex: 1; border: 0; border-radius: 0; box-shadow: none; min-height: 48px; background: var(--card); }
.seg button + button { border-left: 3px solid var(--ink); }
.seg button.on { background: var(--ink); color: #fff; }
.seg button:disabled { opacity: 1; }
.seg button:disabled:not(.on) { color: var(--soft); }
.teams { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.teams .slot { padding: 6px 8px; gap: 8px; font-size: 16px; min-height: 52px; overflow: hidden; }
.teams .slot .badge { display: none; }
.teams button.ghost { min-height: 44px; padding: 6px; }
.stats { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.stats th { font-size: 12px; color: var(--soft); font-weight: 700; text-align: right; padding: 2px 4px; }
.stats td { text-align: right; padding: 4px; border-top: 1px solid var(--line); }
.stats td:first-child, .stats th:first-child { text-align: left; }
.stats .who { display: flex; align-items: center; gap: 6px; font-weight: 800; }
.stats .dot { width: 22px; height: 22px; font-size: 11px; }
.timer.ot { color: var(--accent); }
.timer.last { animation: pulse 1s infinite; color: var(--bad); }
@keyframes pulse { 50% { transform: scale(1.15); } }
.awards { display: grid; gap: 8px; text-align: left; }
.award { display: flex; gap: 10px; align-items: center; background: var(--card); border: 2px solid var(--ink); border-radius: 14px; padding: 8px 10px; opacity: 0; transform: scale(0.8); animation: pop 0.4s cubic-bezier(.2,1.6,.4,1) forwards; }
.award .ico { font-size: 26px; }
.award b { display: block; font-size: 15px; }
.award span.who { font-size: 13px; color: var(--soft); }
@keyframes pop { to { opacity: 1; transform: none; } }
.overlay .box { max-height: calc(100% - 20px); overflow-y: auto; }
.dot { width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; font-size: 14px; }
#banner { position: fixed; left: 50%; top: calc(8px + env(safe-area-inset-top)); transform: translateX(-50%); z-index: 50; background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 12px; font-size: 15px; font-weight: 700; max-width: 92vw; text-align: center; pointer-events: none; }
#banner:empty { display: none; }

/* Game screen */
.game { position: fixed; inset: 0; background: var(--sea); display: flex; flex-direction: column; touch-action: none; user-select: none; -webkit-user-select: none; }
.topbar { flex: none; display: flex; align-items: center; gap: 8px; padding: calc(6px + env(safe-area-inset-top)) 10px 6px; background: rgba(251, 247, 236, 0.92); border-bottom: 2px solid rgba(31, 42, 51, 0.12); }
.timer { font-weight: 900; font-variant-numeric: tabular-nums; min-width: 52px; font-size: 18px; }
.chips { display: flex; gap: 6px; flex: 1; justify-content: flex-end; }
.chip { display: flex; align-items: center; gap: 4px; padding: 3px 8px 3px 4px; border-radius: 999px; background: #fff; border: 2px solid currentColor; font-weight: 900; font-size: 15px; font-variant-numeric: tabular-nums; }
.chip .dot { width: 20px; height: 20px; font-size: 11px; }
.chip.me { box-shadow: 0 0 0 2px var(--ink); }
.chip.out { opacity: 0.35; text-decoration: line-through; }
.chip.away .dot { opacity: 0.4; }
.board { flex: 1; position: relative; min-height: 0; overflow: hidden; }
.board canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px; background: rgba(31, 42, 51, 0.35); }
.overlay .box { background: var(--bg); border: 3px solid var(--ink); border-radius: 22px; padding: 22px; max-width: 360px; width: 100%; box-shadow: var(--sticker); display: flex; flex-direction: column; gap: 12px; text-align: center; }
.toast { position: absolute; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: rgba(31, 42, 51, 0.85); color: #fff; padding: 8px 14px; border-radius: 12px; font-size: 15px; font-weight: 700; pointer-events: none; white-space: nowrap; }
.toast:empty { display: none; }
.news { position: absolute; left: 50%; top: 10px; transform: translate(-50%, calc(-100% - 40px)); width: min(92%, 380px); background: var(--ink); color: #fff; border-radius: 16px; padding: 10px 14px; font-weight: 800; font-size: 16px; line-height: 1.3; text-align: center; box-shadow: var(--sticker); transition: transform 0.35s cubic-bezier(.2,1.4,.4,1); pointer-events: none; }
.news.show { transform: translate(-50%, 0); }
.news .big { display: block; font-size: 26px; }
.chaosbar { position: absolute; left: 8px; top: 8px; display: flex; flex-direction: column; gap: 4px; pointer-events: none; }
.chaosbar span { background: rgba(255,255,255,0.92); border: 2px solid var(--ink); border-radius: 999px; padding: 2px 9px; font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; }
.toggle { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 800; }
.toggle button { min-height: 44px; padding: 6px 16px; }
.powers { position: absolute; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); display: flex; gap: 8px; align-items: flex-end; }
.powers button { width: 58px; height: 58px; min-height: 58px; padding: 0; border-radius: 18px; font-size: 26px; line-height: 1; display: grid; place-items: center; }
.powers button small { display: block; font-size: 10px; font-weight: 800; margin-top: -2px; }
.powers button.armed { background: var(--ink); color: #fff; transform: translateY(-4px); }
.powers .charge { display: flex; gap: 3px; padding: 6px 8px; background: rgba(255,255,255,0.9); border: 2px solid var(--ink); border-radius: 999px; align-items: center; }
.powers .charge i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--ink); display: inline-block; }
.powers .charge i.on { background: var(--ink); }
</style>
</head>
<body>
<div id="banner"></div>
<div id="app"></div>

<!-- ======================================================================
     CONFIG: every tuning knob in one place.
     ====================================================================== -->
<script id="config">
'use strict';
const CONFIG = {
  version: '0.8',
  maxPlayers: 4,
  minPlayers: 2,              // the host can still start alone for a practice run
  modes: { ffa: 'Free for all', teams: '2 v 2' },
  bots: {                     // computer players the host can add to fill empty seats
    thinkSeconds: 1.2,        // how often a bot looks at the map
    attackChance: 0.7,        // how keen it is to attack when it can win
    names: ['Nigel', 'Sharon', 'Big Dave', 'Auntie Pat', 'Gaz', 'Brenda', 'Terry', 'Shazza'],
  },
  powerups: {                 // earned by capturing cities, held in two slots, used with a tap
    capturesPerPowerup: 3,
    maxHeld: 2,
    speed: { seconds: 10, factor: 2 },       // your troops sent in this window travel twice as fast
    shield: { seconds: 15 },                 // one of your cities can't be hurt by enemy troops
    sabotage: { seconds: 10 },               // one enemy city stops producing
  },
  chaos: {                    // random UK-flavoured events; the host can switch them off in the lobby
    firstAfterSeconds: 60,
    gapSeconds: [40, 70],     // random gap between events
    quietLastSeconds: 45,     // nothing new near the end, so an event never decides the match
    railStrike: { weight: 3, seconds: 20 },
    bankHoliday: { weight: 2, seconds: 15, production: 2 },
    stormGerald: { weight: 1, seconds: 20 },
    greggs: { weight: 2, troops: 20 },
    heatwave: { weight: 2, seconds: 20, production: 0.5 },
  },
  matchSeconds: 480,          // time limit; then most cities wins (total troops breaks a tie)
  overtimeAtSeconds: 300,     // from here all production is boosted so stalemates break
  overtimeBoost: 1.5,
  tickMs: 100,                // server simulation step (10 Hz)
  sendFraction: 0.5,          // share of a city's garrison sent per drag
  defenderBonus: 1.1,         // defenders count this much more than attackers
  travelSpeed: 40,            // map units per second along links (a long link is about 4 seconds)
  production: { L: 1.0, M: 0.6, S: 0.35 },   // troops per second at level 1
  cap: { L: 60, M: 50, S: 40 },              // troop cap at level 1 (production stops here)
  maxLevel: 3,
  upgradeCost: [0, 0, 35, 70],               // troops from the city's garrison to reach level 2, 3
  levelProduction: [0, 1, 1.5, 2],           // production multiplier by level
  levelCap: [0, 1, 5 / 3, 2.5],              // cap multiplier by level (60 / 100 / 150 for a large city)
  startGarrison: 20,          // each player's own starting cities
  neutralGarrison: { L: 30, M: 18, S: 10 },
  dropGraceSeconds: 60,       // a disconnected player's cities keep producing this long, then freeze
  idleAfterSeconds: 6,        // no ping for this long counts as disconnected
  // Okabe-Ito colours (colour-blind safe) with a shape each as a backup.
  players: [
    { colour: '#0072B2', shape: 'circle', name: 'Blue' },
    { colour: '#E69F00', shape: 'triangle', name: 'Orange' },
    { colour: '#CC79A7', shape: 'square', name: 'Pink' },
    { colour: '#009E73', shape: 'diamond', name: 'Green' },
  ],
  // 2 v 2: a blue team and an orange-red team, each player a distinct shade.
  teamColours: [['#0072B2', '#56B4E9'], ['#D55E00', '#E69F00']],
  teamNames: ['Blue team', 'Orange team'],
  neutralColour: '#9a9d9f',
};
</script>

<!-- ======================================================================
     SIM: the authoritative game. Runs only on the host; pure data in and out, so it also runs in Node tests.
       Players send intents (send troops); the Sim validates and applies them.
     ====================================================================== -->
<script id="sim">
'use strict';
const Sim = (() => {
  let MAP = null, ADJ = null, LEN = null, IDX = null;
  const MAPS = {};   // every map this Sim knows, by id; the first one added is the default

  function setMap(map) {
    if (!MAPS[map.id]) MAPS[map.id] = map;
    MAP = map;
    IDX = {};
    map.cities.forEach((c, i) => { IDX[c.id] = i; });
    ADJ = map.cities.map(() => []);
    LEN = {};
    for (const [a, b] of map.links) {
      const i = IDX[a], j = IDX[b];
      if (i === undefined || j === undefined) throw new Error(`Bad link ${a}-${b}`);
      ADJ[i].push(j); ADJ[j].push(i);
      LEN[i + ',' + j] = LEN[j + ',' + i] = Math.hypot(map.cities[i].x - map.cities[j].x, map.cities[i].y - map.cities[j].y);
    }
  }
  const map = () => MAP;
  const maps = () => Object.values(MAPS).map(m => ({ id: m.id, name: m.name }));
  // Make sure the Sim is on this game's map (a host that refreshed comes back on the right one).
  function useMapOf(g) {
    const id = g.mapId || Object.keys(MAPS)[0];
    if (MAPS[id] && MAP !== MAPS[id]) setMap(MAPS[id]);
  }
  function setMapChoice(g, id) {
    if (g.phase !== 'lobby' || !MAPS[id] || g.mapId === id) return false;
    g.mapId = id;
    useMapOf(g);
    return true;
  }
  const adj = i => ADJ[i];
  const linkLen = (i, j) => LEN[i + ',' + j];

  function createGame() {
    return { spectators: {}, phase: 'lobby', mode: 'ffa', chaos: true, chaosOn: [], nextChaosAt: 0, players: {}, t: 0, cities: [], fleets: [], nextFleet: 1, events: [], nextEvent: 1, winner: null, winTeam: null, endReason: null, startN: 0 };
  }
  const list = g => Object.values(g.players).sort((a, b) => a.idx - b.idx);
  const teams = g => g.mode === 'teams';
  const byIdx = (g, idx) => list(g).find(q => q.idx === idx);
  // Same player, or teammates in 2 v 2.
  function allied(g, a, b) {
    if (a === b) return true;
    if (!teams(g) || a < 0 || b < 0) return false;
    const p = byIdx(g, a), q = byIdx(g, b);
    return !!p && !!q && p.team === q.team;
  }

  function addPlayer(g, id, name) {
    const p = g.players[id];
    if (p) { p.name = name || p.name; p.connected = true; p.goneAt = null; return { ok: true }; }
    // A match already on, or no seats left: come in and watch instead.
    if (g.phase !== 'lobby' || Object.keys(g.players).length >= CONFIG.maxPlayers) {
      g.spectators = g.spectators || {};
      g.spectators[id] = { id, name };
      return { ok: true, spectator: true };
    }
    if (g.spectators) delete g.spectators[id];
    const used = new Set(list(g).map(q => q.idx));
    let idx = 0;
    while (used.has(idx)) idx++;
    // New players go to the smaller team.
    const sizes = [0, 1].map(t => list(g).filter(q => q.team === t).length);
    g.players[id] = { id, name, idx, team: sizes[1] < sizes[0] ? 1 : 0, connected: true, goneAt: null, out: false, stats: null };
    return { ok: true };
  }

  // Returns true if anything visible changed.
  function setConnected(g, id, on) {
    if (g.spectators && g.spectators[id] && !g.players[id]) { if (!on) delete g.spectators[id]; return !on; }
    const p = g.players[id];
    if (!p) return false;
    if (!on && g.phase === 'lobby') { delete g.players[id]; return true; }
    if (p.connected === on) return false;
    p.connected = on;
    p.goneAt = on ? null : g.t;
    return true;
  }
  const frozen = (g, p) => !p.connected && p.goneAt !== null && g.t - p.goneAt >= CONFIG.dropGraceSeconds * 1000;

  // ---- bots: computer players run by the host ----
  function addBot(g, rand = Math.random) {
    if (g.phase !== 'lobby' || Object.keys(g.players).length >= CONFIG.maxPlayers) return false;
    const taken = new Set(list(g).map(p => p.name));
    const free = CONFIG.bots.names.filter(n => !taken.has(n));
    let k = 1;
    while (g.players['bot' + k]) k++;
    const id = 'bot' + k;
    addPlayer(g, id, free.length ? free[Math.floor(rand() * free.length)] : 'Bot ' + k);
    g.players[id].bot = true;
    return true;
  }
  function removeBot(g, id) {
    const p = g.players[id];
    if (g.phase !== 'lobby' || !p || !p.bot) return false;
    delete g.players[id];
    return true;
  }
  // A greedy bot: attack the weakest neighbour it can beat, feed spare troops to the front line
  // (a teammate's too), upgrade when safe, and use power-ups as soon as there's a sensible target.
  function botThink(g, p, rand = Math.random) {
    const B = CONFIG.bots;
    const ally = o => allied(g, o, p.idx);
    const mine = g.cities.map((c, i) => i).filter(i => g.cities[i].o === p.idx);
    const front = j => ADJ[j].some(k => !ally(g.cities[k].o));
    // Power-ups first.
    p.powers.forEach((kind, slot) => {
      if (kind === 'speed') usePower(g, p.id, slot);
      else if (kind === 'shield') {
        const threatened = mine.filter(i => ADJ[i].some(k => g.cities[k].o >= 0 && !ally(g.cities[k].o)))
          .sort((a, b) => g.cities[b].n - g.cities[a].n)[0];
        if (threatened !== undefined) usePower(g, p.id, slot, threatened);
      } else if (kind === 'sabotage') {
        const enemy = g.cities.map((c, i) => i).filter(i => g.cities[i].o >= 0 && !ally(g.cities[i].o) && ADJ[i].some(k => g.cities[k].o === p.idx))
          .sort((a, b) => g.cities[b].n - g.cities[a].n)[0];
        if (enemy !== undefined) usePower(g, p.id, slot, enemy);
      }
    });
    for (const s of mine) {
      const c = g.cities[s];
      const foes = ADJ[s].filter(j => !ally(g.cities[j].o) && !blocked(g, s, j));
      const hit = foes.filter(j => !shielded(g, g.cities[j]) && Math.floor(c.n * CONFIG.sendFraction) > g.cities[j].n * CONFIG.defenderBonus + 2)
        .sort((a, b) => g.cities[a].n - g.cities[b].n)[0];
      if (hit !== undefined && rand() < B.attackChance) { send(g, p.id, [s], hit); continue; }
      const enemiesNear = foes.some(j => g.cities[j].o >= 0);
      const cost = CONFIG.upgradeCost[(c.lv || 1) + 1];
      if (cost && !enemiesNear && c.n > cost + 10 && rand() < 0.3) { upgrade(g, p.id, s); continue; }
      if (!foes.length && c.n > 20) {
        const fronts = ADJ[s].filter(j => ally(g.cities[j].o) && front(j));
        if (fronts.length) send(g, p.id, [s], fronts[Math.floor(rand() * fronts.length)]);
      }
    }
  }
  function runBots(g) {
    const every = Math.max(1, Math.round(CONFIG.bots.thinkSeconds * 1000 / CONFIG.tickMs));
    const tick = Math.round(g.t / CONFIG.tickMs);
    for (const p of list(g)) if (p.bot && !p.out && (tick + p.idx * 3) % every === 0) botThink(g, p);
  }

  function setChaos(g, on) {
    if (g.phase !== 'lobby' || g.chaos === !!on) return false;
    g.chaos = !!on;
    return true;
  }

  // ---- chaos events ----
  const linkKey = (i, j) => (i < j ? i + ',' + j : j + ',' + i);
  const blocked = (g, i, j) => (g.chaosOn || []).some(e => e.links && e.links.includes(linkKey(i, j)));
  const chaosActive = (g, k) => (g.chaosOn || []).some(e => e.k === k);
  const isSea = (i, j) => (MAP.seaLinks || []).some(([a, b]) => linkKey(IDX[a], IDX[b]) === linkKey(i, j));
  const southern = i => MAP.cities[i].y >= (MAP.southLine || Infinity);
  // Production multiplier from whatever chaos is on right now.
  function chaosProduction(g, i) {
    let m = 1;
    if (chaosActive(g, 'bankHoliday')) m *= CONFIG.chaos.bankHoliday.production;
    if (chaosActive(g, 'heatwave') && southern(i)) m *= CONFIG.chaos.heatwave.production;
    return m;
  }
  const pick = (arr, rand) => arr[Math.floor(rand() * arr.length)];
  // Fires one event (a given kind, or a weighted random one that makes sense right now). Returns the event or null.
  function chaos(g, kind, rand = Math.random) {
    const C = CONFIG.chaos, name = i => MAP.cities[i].name;
    const neutrals = g.cities.map((c, i) => i).filter(i => g.cities[i].o < 0);
    const landLinks = MAP.links.map(([a, b]) => [IDX[a], IDX[b]]).filter(([i, j]) => !isSea(i, j) && !blocked(g, i, j));
    const ok = {
      railStrike: landLinks.length > 0 && !chaosActive(g, 'railStrike'),
      bankHoliday: !chaosActive(g, 'bankHoliday'),
      stormGerald: (MAP.seaLinks || []).length > 0 && !chaosActive(g, 'stormGerald'),
      greggs: neutrals.length > 0,
      heatwave: !!MAP.southLine && !chaosActive(g, 'heatwave'),
    };
    if (!kind) {
      const pool = Object.keys(ok).filter(k => ok[k]);
      let r = rand() * pool.reduce((s, k) => s + C[k].weight, 0);
      kind = pool.find(k => (r -= C[k].weight) < 0) || pool[0];
    }
    if (!kind || !ok[kind]) return null;
    const until = g.t + (C[kind].seconds || 0) * 1000;
    let on = null, text = '';
    if (kind === 'railStrike') {
      // Prefer a line someone actually uses: one touching a player's city.
      const used = landLinks.filter(([i, j]) => g.cities[i].o >= 0 || g.cities[j].o >= 0);
      const [i, j] = pick(used.length ? used : landLinks, rand);
      on = { k: kind, until, links: [linkKey(i, j)] };
      text = `Rail strike! ${name(i)}–${name(j)} line shut for ${C[kind].seconds}s`;
    } else if (kind === 'stormGerald') {
      on = { k: kind, until, links: MAP.seaLinks.map(([a, b]) => linkKey(IDX[a], IDX[b])) };
      text = `Storm Gerald! Ferries cancelled for ${C[kind].seconds}s`;
    } else if (kind === 'bankHoliday') {
      on = { k: kind, until };
      text = `Bank holiday! Everyone's production doubled for ${C[kind].seconds}s`;
    } else if (kind === 'heatwave') {
      on = { k: kind, until };
      text = `Heatwave! The South wilts: production halved for ${C[kind].seconds}s`;
    } else if (kind === 'greggs') {
      const i = pick(neutrals, rand);
      g.cities[i].n += C.greggs.troops;
      text = `A new Greggs opens in ${name(i)}. ${C.greggs.troops} more locals dig in`;
      event(g, { k: 'chaos', kind, text, c: i });
      return { k: kind, c: i };
    }
    g.chaosOn.push(on);
    event(g, { k: 'chaos', kind, text });
    return on;
  }
  function updateChaos(g, rand = Math.random) {
    g.chaosOn = (g.chaosOn || []).filter(e => e.until > g.t);
    if (!g.chaos) return;
    const C = CONFIG.chaos;
    if (g.t >= g.nextChaosAt && g.t < (CONFIG.matchSeconds - C.quietLastSeconds) * 1000) {
      chaos(g, null, rand);
      g.nextChaosAt = g.t + (C.gapSeconds[0] + rand() * (C.gapSeconds[1] - C.gapSeconds[0])) * 1000;
    }
  }

  function setMode(g, mode) {
    if (g.phase !== 'lobby' || !CONFIG.modes[mode] || g.mode === mode) return false;
    g.mode = mode;
    return true;
  }
  function setTeam(g, id, team) {
    const p = g.players[id];
    if (g.phase !== 'lobby' || !p || (team !== 0 && team !== 1) || p.team === team) return false;
    if (list(g).filter(q => q.team === team).length >= CONFIG.maxPlayers / 2) return false;
    p.team = team;
    return true;
  }
  function shuffleTeams(g, rand = Math.random) {
    if (g.phase !== 'lobby') return false;
    const ps = list(g);
    for (let i = ps.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [ps[i], ps[j]] = [ps[j], ps[i]]; }
    ps.forEach((p, k) => { p.team = k % 2; });
    return true;
  }

  // Why the match can't start yet, or '' if it can. Solo counts as a practice run.
  function startProblem(g) {
    if (g.phase !== 'lobby') return 'Not in the lobby.';
    const ps = list(g);
    if (!ps.length) return 'Nobody here.';
    if (teams(g)) {
      if (ps.length < 2) return '2 v 2 needs at least two players.';
      if (ps.every(p => p.team === ps[0].team)) return 'Both teams need at least one player.';
    }
    return '';
  }
  const canStart = g => !startProblem(g);

  function start(g, rand = Math.random) {
    if (!canStart(g)) return false;
    useMapOf(g);
    const ps = list(g);
    // Random start corners each match. In 2 v 2 each team gets a pair of neighbouring corners (north or south).
    const slots = MAP.slots.map((s, i) => i);
    for (let i = slots.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [slots[i], slots[j]] = [slots[j], slots[i]]; }
    if (teams(g)) {
      const halves = MAP.teamSlots.map(h => h.slice()).sort(() => rand() - 0.5);
      for (const h of halves) if (rand() < 0.5) h.reverse();
      const next = [0, 0];
      for (const p of ps) p.slot = halves[p.team][next[p.team]++];
    } else ps.forEach((p, k) => { p.slot = slots[k]; });
    g.cities = MAP.cities.map(c => ({ o: -1, n: CONFIG.neutralGarrison[c.size], lv: 1 }));
    for (const p of ps) {
      p.out = false;
      p.powers = []; p.charge = 0; p.speedUntil = 0;
      p.stats = { prize: 0, powerups: 0, taken: 0, lost: 0, sent: 0, upgrades: 0, peak: 3, gifted: 0, low: 3, comeback: 0 };
      for (const cid of MAP.slots[p.slot].cities) g.cities[IDX[cid]] = { o: p.idx, n: CONFIG.startGarrison, lv: 1 };
    }
    g.chaosOn = []; g.nextChaosAt = CONFIG.chaos.firstAfterSeconds * 1000;
    g.phase = 'play'; g.t = 0; g.fleets = []; g.events = []; g.winner = null; g.winTeam = null; g.endReason = null; g.startN = ps.length;
